[project]
name = "kws-stream"
version = "0.1.0"
description = "Streaming keyword spotting with INT8 inference in Python"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["."]
exclude = ['^\.venv/']

# CI has no torch, so torch.nn.Module is Any there; strict mode would reject subclassing it.
[[tool.mypy.overrides]]
module = ["train.model", "train.mfcc_torch"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
